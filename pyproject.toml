[project]
name = "alpha101-polars"
version = "0.1.0"
description = "Polars-native WorldQuant Alpha101 factor expressions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.41.1",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
data = [
    "akshare>=1.18.64",
]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha101"]
